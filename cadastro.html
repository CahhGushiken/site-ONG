<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cadastro — SuperaCão</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="index.html">SuperaCão</a>
      <ul class="menu">
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html">Cadastro / Voluntariado</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Cadastro de Voluntário / Doação</h1>

    <form id="cadastroForm">
      <fieldset>
        <legend>Informações Pessoais</legend>

        <label for="nome">Nome completo *</label>
        <input id="nome" name="nome" type="text"
               required minlength="3"
               title="Digite seu nome completo (mínimo 3 letras).">

        <label for="email">E-mail *</label>
        <input id="email" name="email" type="email"
               required title="Digite um e-mail válido.">

        <label for="cpf">CPF *</label>
        <input id="cpf" name="cpf" type="text"
               required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
               maxlength="14"
               placeholder="000.000.000-00"
               title="Digite o CPF no formato 000.000.000-00.">

        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="tel"
               pattern="\(\d{2}\) \d{5}-\d{4}"
               maxlength="15"
               placeholder="(00) 00000-0000"
               title="Digite o telefone no formato (00) 00000-0000.">

        <label for="nascimento">Data de Nascimento</label>
        <input id="nascimento" name="nascimento" type="date">

        <label for="endereco">Endereço</label>
        <input id="endereco" name="endereco" type="text">

        <label for="cep">CEP *</label>
        <input id="cep" name="cep" type="text"
               required pattern="\d{5}-\d{3}"
               maxlength="9"
               placeholder="00000-000"
               title="Digite o CEP no formato 00000-000.">

        <label for="cidade">Cidade *</label>
        <input id="cidade" name="cidade" type="text"
               required title="Digite o nome da cidade.">

        <label for="estado">Estado (UF) *</label>
        <select id="estado" name="estado" required title="Selecione o estado.">
          <option value="">-- selecione --</option>
          <option value="AC">Acre (AC)</option>
          <option value="AL">Alagoas (AL)</option>
          <option value="AP">Amapá (AP)</option>
          <option value="AM">Amazonas (AM)</option>
          <option value="BA">Bahia (BA)</option>
          <option value="CE">Ceará (CE)</option>
          <option value="DF">Distrito Federal (DF)</option>
          <option value="ES">Espírito Santo (ES)</option>
          <option value="GO">Goiás (GO)</option>
          <option value="MA">Maranhão (MA)</option>
          <option value="MT">Mato Grosso (MT)</option>
          <option value="MS">Mato Grosso do Sul (MS)</option>
          <option value="MG">Minas Gerais (MG)</option>
          <option value="PA">Pará (PA)</option>
          <option value="PB">Paraíba (PB)</option>
          <option value="PR">Paraná (PR)</option>
          <option value="PE">Pernambuco (PE)</option>
          <option value="PI">Piauí (PI)</option>
          <option value="RJ">Rio de Janeiro (RJ)</option>
          <option value="RN">Rio Grande do Norte (RN)</option>
          <option value="RS">Rio Grande do Sul (RS)</option>
          <option value="RO">Rondônia (RO)</option>
          <option value="RR">Roraima (RR)</option>
          <option value="SC">Santa Catarina (SC)</option>
          <option value="SP">São Paulo (SP)</option>
          <option value="SE">Sergipe (SE)</option>
          <option value="TO">Tocantins (TO)</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>Interesse</legend>

        <label for="interesse">Tipo de participação *</label>
        <select id="interesse" name="interesse" required title="Selecione o tipo de participação.">
          <option value="">-- selecione --</option>
          <option value="voluntario">Voluntário</option>
          <option value="doador">Doador</option>
          <option value="colaborador">Colaborador</option>
        </select>

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="5"></textarea>
      </fieldset>

      <div class="form-actions">
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    <p>© SuperaCão</p>
  </footer>

  <script>
    // Máscaras 
    document.getElementById("cpf").addEventListener("input", function (e) {
      let v = e.target.value.replace(/\D/g, "");
      if (v.length > 11) v = v.slice(0, 11);
      v = v.replace(/(\d{3})(\d)/, "$1.$2");
      v = v.replace(/(\d{3})(\d)/, "$1.$2");
      v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      e.target.value = v;
    });

    document.getElementById("telefone").addEventListener("input", function (e) {
      let v = e.target.value.replace(/\D/g, "");
      if (v.length > 11) v = v.slice(0, 11);
      v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
      v = v.replace(/(\d{5})(\d{4})$/, "$1-$2");
      e.target.value = v;
    });

    document.getElementById("cep").addEventListener("input", function (e) {
      let v = e.target.value.replace(/\D/g, "");
      if (v.length > 8) v = v.slice(0, 8);
      v = v.replace(/^(\d{5})(\d{1,3})$/, "$1-$2");
      e.target.value = v;
    });

  const form = document.getElementById("cadastroForm");
  form.addEventListener("submit", function (e) {
    e.preventDefault(); 
    if (form.checkValidity()) {
      alert("Formulário enviado com sucesso! Obrigado por participar!");
      form.reset(); 
    }
  });
  </script>
</body>
</html>
